# Start an OpenAI-compatible generative model server at this loopback endpoint.
# Replace model with the identifier served by your server. No model is downloaded.
work_mode = "local"

[planning]
mode = "inference"
local_only_data = true

[features]
skills_enabled = false
mcp_enabled = true

[providers.local]
enabled = true
provider = "openai_compatible"
model = "your-local-model"
api_url = "http://127.0.0.1:8080/v1/chat/completions"
context_window = 32768
max_concurrency = 1
capabilities = ["planning", "code_analysis", "code_generation", "testing", "documentation", "review", "advanced_reasoning", "tool_use"]

[limits]
max_tasks = 16
max_input_bytes = 16000
max_output_bytes = 65536
max_output_tokens = 8192
call_timeout_ms = 120000
run_timeout_ms = 600000
max_remote_calls = 0

[mcp]
timeout_ms = 10000
max_response_bytes = 65536
max_discovered_tools = 128
max_pages = 8

[mcp.servers.files]
enabled = false
transport = "stdio"
command = 'C:\Program Files\nodejs\node.exe'
args = ['C:\mcp\filesystem\dist\index.js', 'C:\projects\my-project']
cwd = 'C:\projects\my-project'

[mcp.servers.files.tools.read]
name = "read_text_file"
effect = "read_only"

[mcp.servers.files.tools.list]
name = "list_directory"
effect = "read_only"

[mcp.servers.docs]
enabled = false
transport = "http"
url = "https://mcp.example.com/mcp"
allow_remote = true
bearer_token_env = "OSCAR_DOCS_MCP_TOKEN"

[mcp.servers.docs.tools.search]
name = "search_docs"
effect = "read_only"
