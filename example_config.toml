# Offline demo. Set provider = "openai_compatible" with --features http for real inference.
work_mode = "mixed"

[planning]
mode = "heuristic" # Use "inference" with a generative provider declaring "planning".
local_only_data = false

[features]
skills_enabled = false
mcp_enabled = false

[providers.local]
enabled = true
provider = "mock"
model = "local-demo"
context_window = 32768
max_concurrency = 2
capabilities = ["code_generation", "code_analysis", "refactoring", "documentation", "testing", "summarization", "review"]

[providers.remote]
enabled = true
provider = "mock"
model = "remote-demo"
context_window = 128000
max_concurrency = 1
capabilities = ["code_generation", "code_analysis", "refactoring", "documentation", "testing", "summarization", "advanced_reasoning", "architecture", "review", "planning"]

# Proposed classifier settings; not implemented (see docs/decision-classification.md).
#[classification]
