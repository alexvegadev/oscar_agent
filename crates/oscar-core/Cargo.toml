[package]
name = "oscar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
toml = "1.1.8+spec-1.1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
# ICU 2.0 (selected for MSRV 1.85) uses writeable's allocating Display macro.
writeable = { version = "0.6", optional = true, features = ["alloc"] }
rig = { package = "rig-core", version = "=0.11.1", optional = true, default-features = false }

[features]
default = []
http = ["dep:reqwest", "dep:writeable"]
rag = ["dep:rig", "dep:reqwest", "dep:writeable"]

[lints]
workspace = true
