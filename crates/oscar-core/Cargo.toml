[package]
name = "oscar-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
toml = "1.1.8+spec-1.1.0"
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["json", "rustls-tls"] }
# ICU 2.0 uses writeable's allocating Display macro.
writeable = { version = "0.6", optional = true, features = ["alloc"] }
rig = { package = "rig-core", version = "=0.32.0", optional = true, default-features = false }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = []
http = ["dep:reqwest", "dep:writeable", "dep:rig", "dep:bytes", "dep:futures-util", "dep:async-stream", "dep:tracing"]
rag = ["dep:rig", "dep:reqwest", "dep:writeable"]
mcp = ["http", "tokio/process", "tokio/io-util"]

[lints]
workspace = true

[[test]]
name = "mcp_stdio"
path = "tests/mcp_stdio.rs"
harness = false
required-features = ["mcp"]
